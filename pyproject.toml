[project]
name = "holo"
version = "0.1.0"
description = "AcousticTap: Palm rest acoustic gesture recognition"
readme = "README.md"
authors = [
    { name = "shivprasadkivade77", email = "shivprasadkivade77@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "joblib>=1.4.0",
    "librosa>=0.10.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.4.0",
    "sounddevice>=0.4.6",
]

[project.scripts]
holo = "holo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
